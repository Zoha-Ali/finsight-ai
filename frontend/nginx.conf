server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router handles routing client-side (e.g. /dashboard, /chat) -
    # any path not matching a real static file falls back to index.html
    # so the SPA's own router can take over, instead of nginx 404ing on
    # a hard refresh or direct link to a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
